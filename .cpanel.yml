---
# TICH ERP — cPanel Git deployment (production)
#
# After push: cPanel → Git Version Control → Update from Remote → Deploy HEAD Commit
#
# One-time (File Manager, no terminal):
#   Copy deploy/cpanel/docroot.txt.example → deploy/cpanel/docroot.txt
#   Edit docroot.txt — one line, full path to tich.africa public_html folder
#
# If deploy succeeds but CSS missing, read: deploy/cpanel/last-asset-sync.log

deployment:
  tasks:
    - /bin/chmod +x deploy/cpanel/sync-public-assets.sh
    - cd web && /usr/local/bin/ea-php82 /opt/cpanel/composer/bin/composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
    - cd web && /usr/local/bin/ea-php82 artisan down --render="errors::503" --retry=120 || true
    - cd web && /usr/local/bin/ea-php82 artisan migrate --force --no-interaction
    - cd web && /usr/local/bin/ea-php82 artisan storage:link --force || true
    - cd web && /usr/local/bin/ea-php82 artisan optimize --no-interaction
    - cd web && /usr/local/bin/ea-php82 artisan view:cache --no-interaction
    - /bin/bash deploy/cpanel/sync-public-assets.sh
    - cd web && /bin/chmod -R ug+rwx storage bootstrap/cache || true
    - cd web && /usr/local/bin/ea-php82 artisan up || true
