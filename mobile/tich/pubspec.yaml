name: tich
description: TICH Africa mobile app (Flutter) - connects to the Laravel ERP API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  laravel_reverb: ^0.3.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  geolocator: ^14.0.1
  file_picker: ^10.1.2
  url_launcher: ^6.3.1
  http_parser: ^4.1.2
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  permission_handler: ^13.0.2
  workmanager: ^0.10.10
  uuid: ^4.6.0
  cunning_document_scanner: ^3.0.3
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  open_file: ^3.5.10
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png
  macos:
    generate: true
    image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
